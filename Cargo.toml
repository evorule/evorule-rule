[package]
name = "evorule-rule"
version = "0.1.0"
edition = "2021"
description = "evorule-rule data governance system — JSON rule asset library (decision point ①: data model & schema)"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
