[package]
name = "evorule-rule"
version = "0.5.0"
edition = "2021"
description = "evorule-rule data governance system — JSON rule asset library (decision point ①: data model & schema)"
license = "AGPL-3.0-or-later"
repository = "https://gitee.com/evorule/evorule-rule"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
# 密码哈希 Argon2id（OWASP 一线推荐；m=19MiB/t=2/p=1，PBKDF2 降级为 legacy 校验路径）
argon2 = "0.5"
evorule-hash = { version = "0.1.3" }
subtle = "2"
# 共享快照包校验（跨仓集成契约；T1：版本/依赖/溯源/符号提取 + 6 项校验链 SSOT = evorule-bundle）
# 0.4.0：知识资产化批次 A——BundleEntry 增 knowledge_kind/trust_level/license_ref/execution_contract
# （Option 兼容字段，旧 bundle 字节不变；ExecutionContract 类型随行）
# 0.5.1：O-377① 批 1——DatasetBundle 增可选 recipe_snapshot（策略快照随包固化，
# 全包哈希覆盖；可选字段不 bump BUNDLE_SCHEMA_VERSION）；0.5.1 修根部 re-export
evorule-bundle = { version = "0.5.1" }
rand = "0.8"
base64 = "0.22"
# 0.32：与 evorule-server workspace（evorule-workspace 0.32）对齐——libsqlite3-sys
# 的 links = "sqlite3" 不允许同图双版本，跨仓 dev 依赖（Q12 端到端验收）要求同源
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# 独立治理服务二进制（Phase 2：console-cloud GovernanceBackend 对接目标）
[[bin]]
name = "evorule-rule-serve"
path = "src/main.rs"

# PostgreSQL 生产后端（历史批次1 §2）：默认不启用，`--features postgres` 才编译。
# sqlx 为强重型依赖（异步 + 迁移嵌入），门控避免默认 build/test/clippy 负重。
# SQLite 仍是当前 MVP 活跃引擎，PG 为生产级后续（如实标注，见 store/pg.rs / 设计文档 §6）。
[features]
postgres = ["dep:sqlx"]

[dependencies.sqlx]
version = "0.8"
optional = true
default-features = false
features = ["runtime-tokio", "postgres", "migrate", "json"]
