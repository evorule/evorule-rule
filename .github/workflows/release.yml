# Release workflow for EvoRule Rule (治理中心)
#
# 触发: 推送 v* tag
# 产物: 双平台双 bin (GitHub Release 附件)
#   - evorule-rule-serve  治理中心服务 (gitee/giteeGo agent 不可用 UV-098,由本链供养 gitee Release)
#   - evorule-rule-cli    数据集导入导出 CLI
#   - Linux   x86_64 (ubuntu-latest, 静态 musl)
#   - Windows x86_64 (windows-latest)
#
# 设计说明:
# - 与 evorule / evorule-server 仓同构: gitee 是主仓/发布主入口, github 承担双平台
#   构建并经 Gitee OpenAPI 回传附件 (幂等创建 Release)
# - sanity check 不使用 >/dev/null 重定向: windows runner 默认 pwsh,该 Unix 语法
#   会报 "Could not find a part of the path 'D:\dev\null'" (evorule-server 仓
#   v0.4.1 首次 Release 已踩坑,UV-100 顺带发现) —— 输出直接进日志,兼作证据
# - tag 格式: v0.3.1 等
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. 双平台矩阵构建
  # ==========================================================================
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装 musl 工具链 (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 构建双 bin (serve + cli)
        run: cargo build --release --target ${{ matrix.target }} --bins

      # 无重定向: pwsh 下 >/dev/null 会炸(见文件头说明),--help 退出码 0 即通过
      - name: binary sanity check (防"编译过但起不来"被当成成功)
        run: |
          target/${{ matrix.target }}/release/evorule-rule-serve${{ matrix.ext }} --help
          target/${{ matrix.target }}/release/evorule-rule-cli${{ matrix.ext }} --help

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: evorule-rule-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/evorule-rule-serve${{ matrix.ext }}
            target/${{ matrix.target }}/release/evorule-rule-cli${{ matrix.ext }}
          if-no-files-found: error

  # ==========================================================================
  # 2. 汇总发布 (GitHub Release)
  # ==========================================================================
  release:
    name: release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # merge-multiple=true 时 artifacts/ 内是产物本体,校验后重命名补平台后缀
      - name: 校验产物并补平台后缀
        run: |
          ls -la artifacts/
          test -f artifacts/evorule-rule-serve
          test -f artifacts/evorule-rule-serve.exe
          test -f artifacts/evorule-rule-cli
          test -f artifacts/evorule-rule-cli.exe
          mv artifacts/evorule-rule-serve      artifacts/evorule-rule-serve-linux-x86_64
          mv artifacts/evorule-rule-serve.exe  artifacts/evorule-rule-serve-windows-x86_64.exe
          mv artifacts/evorule-rule-cli        artifacts/evorule-rule-cli-linux-x86_64
          mv artifacts/evorule-rule-cli.exe    artifacts/evorule-rule-cli-windows-x86_64.exe
          cd artifacts
          sha256sum * > sha256-checks.txt
          cat sha256-checks.txt
          ls -la

      - name: 创建 Release 并附加产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/evorule-rule-serve-linux-x86_64
            artifacts/evorule-rule-serve-windows-x86_64.exe
            artifacts/evorule-rule-cli-linux-x86_64
            artifacts/evorule-rule-cli-windows-x86_64.exe
            artifacts/sha256-checks.txt
          generate_release_notes: true

  # ==========================================================================
  # 3. 全量产物附加到 Gitee Release (gitee 是主仓/发布主入口)
  #    与 evorule / evorule-server 仓同构: Gitee Go 云端 agent 不可用(资源侧
  #    问题登记台账 UV-098),产物由本侧构建并经 Gitee OpenAPI 回传;agent 就绪
  #    后可切回原生构建。
  #    幂等: gitee release 不存在则创建,存在则复用。
  #    需在 github 仓库 Settings → Secrets and variables → Actions 配置 GITEE_TOKEN
  #    (Gitee 个人令牌,勾选 releases + projects 权限)
  #    教训(UV-098): gitee attach_files 同名文件并存不去重,本链为唯一上传方,
  #    禁止本地补发叠加
  # ==========================================================================
  attach-gitee:
    name: attach-all-to-gitee
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: evorule-rule-linux-x86_64
          path: gitee-assets/linux

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: evorule-rule-windows-x86_64
          path: gitee-assets/windows

      - name: 补平台后缀并计算 sha256
        run: |
          mv gitee-assets/linux/evorule-rule-serve      gitee-assets/evorule-rule-serve-linux-x86_64
          mv gitee-assets/linux/evorule-rule-cli        gitee-assets/evorule-rule-cli-linux-x86_64
          mv gitee-assets/windows/evorule-rule-serve.exe gitee-assets/evorule-rule-serve-windows-x86_64.exe
          mv gitee-assets/windows/evorule-rule-cli.exe   gitee-assets/evorule-rule-cli-windows-x86_64.exe
          cd gitee-assets
          sha256sum evorule-rule-* > sha256-checks.txt
          cat sha256-checks.txt
          ls -la

      - name: 附加到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          REPO="evorule/evorule-rule"
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$GITEE_TOKEN" ]; then echo "ERROR: github secrets 缺 GITEE_TOKEN"; exit 1; fi
          echo "TAG=$TAG → gitee release"

          # 幂等: 已存在则按 tag 查询,否则创建
          RELEASE_ID=$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsS \
            "https://gitee.com/api/v5/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "gitee release 不存在,创建..."
            RELEASE_RESP=$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases" \
              -H "Content-Type: application/json" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"EvoRule Rule ${TAG}\",\"body\":\"EvoRule Rule ${TAG} — 详见 CHANGELOG.md\",\"target_commitish\":\"main\"}" \
              || echo "")
            RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: 无法获取 gitee release id"
            exit 1
          fi
          echo "gitee Release id: ${RELEASE_ID}"

          cd gitee-assets
          for f in evorule-rule-serve-linux-x86_64 evorule-rule-cli-linux-x86_64 evorule-rule-serve-windows-x86_64.exe evorule-rule-cli-windows-x86_64.exe sha256-checks.txt; do
            echo "上传 ${f} ..."
            curl --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          echo "DONE: https://gitee.com/${REPO}/releases/tag/${TAG}"
