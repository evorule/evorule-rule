name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== Lint (clippy + fmt) =====
  # rusqlite 用 bundled feature,无需系统 libsqlite3
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===== Rust tests =====
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ hashFiles('**/Cargo.toml') }}

      # postgres feature 门控 sqlx,默认不编译;2 个 ignored 测试需本地 evo-agent serve(既有设计)
      - name: cargo test --workspace
        run: cargo test --workspace

  # ===== Release build (编译验证) =====
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo build --release
        run: cargo build --release --bins

      - name: Upload evorule-rule-serve binary
        uses: actions/upload-artifact@v4
        with:
          name: evorule-rule-serve-linux-x86_64
          path: target/release/evorule-rule-serve
          retention-days: 7
          if-no-files-found: error
