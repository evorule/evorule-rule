name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== Lint (clippy + fmt) =====
  # rusqlite 用 bundled feature,无需系统 libsqlite3
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===== 原生服务声明漂移检查（UV-180/P0-2 · 零 cargo 依赖）=====
  # 治理侧嵌入副本 = 本仓 src/model/*.embedded.json；
  # SSOT = evorule-server plugins/*/official_native_services.json。
  # fail-closed：漂移即红灯。修复 = 运行 evorule-server/scripts/sync-native-services.ps1 同步。
  native-services-sync:
    name: Native services drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout evorule-server（SSOT 侧，取同步脚本）
        uses: actions/checkout@v4
        with:
          # 改从 Gitee 主仓 checkout(2026-09-16 整改): 原指向 GitHub 镜像侧,
          # 镜像同步慢/失败会误报漂移红灯; Gitee 为权威源, 无此依赖。
          repository: https://gitee.com/evorule/evorule-server.git
          ref: main
          path: evorule-server
      - name: 逐字节校验嵌入副本 vs SSOT
        shell: pwsh
        run: pwsh -NoProfile -File evorule-server/scripts/sync-native-services.ps1 -Verify -RepoRule "${{ github.workspace }}"

  # ===== Rust tests =====
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ hashFiles('**/Cargo.toml') }}

      # postgres feature 门控 sqlx,默认不编译;2 个 ignored 测试需本地 evo-agent serve(既有设计)
      - name: cargo test --workspace
        run: cargo test --workspace

  # ===== Release build (编译验证) =====
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo build --release
        run: cargo build --release --bins

      - name: Upload evorule-rule-serve binary
        uses: actions/upload-artifact@v4
        with:
          name: evorule-rule-serve-linux-x86_64
          path: target/release/evorule-rule-serve
          retention-days: 7
          if-no-files-found: error
